[env:esp32dev]
platform = espressif32
board    = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

lib_deps =
  bodmer/TFT_eSPI         @ ^2.5.43
  lvgl/lvgl               @ 8.3.11
  madhephaestus/ESP32Servo @ ^3.0.5

build_flags =
  -DCORE_DEBUG_LEVEL=0
  ; ── TFT_eSPI: ILI9341, CYD pinout ──────────────────────────
  -DUSER_SETUP_LOADED=1
  -DILI9341_2_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=1
  -DTFT_INVERSION_ON=1
  -DSPI_FREQUENCY=20000000
  -DSPI_READ_FREQUENCY=20000000
  ; ── Touch XPT2046 (separate SPI bus) ───────────────────────
  -DTOUCH_CS=33
  -DSPI_TOUCH_FREQUENCY=2500000
  ; ── LVGL ────────────────────────────────────────────────────
  -DLV_CONF_INCLUDE_SIMPLE=1
  -DLV_USE_LOG=0
  -DLV_COLOR_DEPTH=16
  -DLV_HOR_RES_MAX=320
  -DLV_VER_RES_MAX=240

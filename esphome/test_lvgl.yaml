esphome:
  name: cat-litter-lvgl-test

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: "YOUR_SSID"
  password: "YOUR_PASSWORD"

logger:

api:

ota:
  platform: esphome

spi:
  id: vspi_display
  mosi_pin: GPIO13
  miso_pin: GPIO12
  clk_pin: GPIO14

lvgl:
  displays:
    - tft_display
  touchscreens:
    - my_touch
  rotation: 90
  pages:
    - id: main_page
      widgets:
        - label:
            text: "LVGL OK!"
            align: center
        - button:
            id: test_btn
            on_press:
              then:
                - lvgl.label.update:
                    id: status_label
                    text: "Button pressed!"
            widgets:
              - label:
                  id: status_label
                  text: "Test Button"

display:
  - platform: ili9xxx
    id: tft_display
    model: ili9341
    spi_id: vspi_display
    dc_pin: GPIO2
    cs_pin: GPIO15
    reset_pin: GPIO21
    invert_colors: false
    dimensions:
      width: 320
      height: 240
    update_interval: never

touchscreen:
  - platform: xpt2046
    id: my_touch
    cs_pin: GPIO33
    update_interval: 50ms
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860

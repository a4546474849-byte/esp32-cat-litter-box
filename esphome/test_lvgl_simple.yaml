esphome:
  name: lvgl-test-simple

esp32:
  board: esp32dev
  framework:
    type: arduino

# Минимальный WiFi для теста
wifi:
  ssid: "K2"
  password: "a4546474849"
  fast_connect: true
  output_power: 8.5dB

logger:

api:

ota:
  platform: esphome

spi:
  id: vspi_display
  mosi_pin: GPIO13
  miso_pin: GPIO12
  clk_pin: GPIO14

font:
  - file: "gfonts://Montserrat"
    id: font_24
    size: 24
  - file: "gfonts://Montserrat"
    id: font_48
    size: 48

lvgl:
  displays:
    - tft_display
  touchscreens:
    - my_touch
  rotation: 90
  buffer_size: 20%
  pages:
    - id: test_page
      bg_color: 0x121212
      widgets:
        - label:
            text: "LVGL OK!"
            align: center
            text_font: font_48
            text_color: 0x10B981

        - button:
            id: test_btn
            x: 108
            y: 150
            width: 105
            height: 50
            bg_color: 0x3F1F03
            border_width: 2
            border_color: 0x10B981
            radius: 8
            on_press:
              then:
                - lvgl.label.update:
                    id: status_label
                    text: "PRESSED!"
            widgets:
              - label:
                  id: status_label
                  text: "PRESS ME"
                  text_color: 0xFFFFFF

display:
  - platform: ili9xxx
    id: tft_display
    model: ili9341
    spi_id: vspi_display
    dc_pin: GPIO2
    cs_pin: GPIO15
    reset_pin: GPIO21
    invert_colors: true
    dimensions:
      width: 320
      height: 240
    update_interval: never

touchscreen:
  - platform: xpt2046
    id: my_touch
    cs_pin: GPIO33
    update_interval: 50ms
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860

esphome:
  name: cyd-test

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

spi:
  mosi_pin: GPIO13
  miso_pin: GPIO12
  clk_pin: GPIO14

display:
  - platform: ili9xxx
    model: ili9341
    dc_pin: GPIO2
    cs_pin: GPIO15
    reset_pin: GPIO21
    invert_colors: true
    rotation: 90
    color_palette: 8BIT
    update_interval: never
    lambda: |-
      it.fill(COLOR_ON);
      it.rectangle(0, 0, it.get_width(), it.get_height(), COLOR_OFF);
      it.line(0, 0, it.get_width(), it.get_height(), COLOR_OFF);
      it.line(it.get_width(), 0, 0, it.get_height(), COLOR_OFF);

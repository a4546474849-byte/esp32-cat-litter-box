esphome:
  name: smart-cat-litter

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: "YOUR_SSID"
  password: "YOUR_PASSWORD"

logger:

api:

ota:
  platform: esphome

# --- SPI для дисплея (VSPI) ---
spi:
  id: vspi_display
  mosi_pin: GPIO13
  miso_pin: GPIO12
  clk_pin: GPIO14

# --- Дисплей ILI9341 320x240 ---
display:
  - platform: ili9xxx
    id: tft_display
    model: ili9341
    spi_id: vspi_display
    dc_pin: GPIO2
    cs_pin: GPIO15
    reset_pin: GPIO21
    invert_colors: false
    rotation: 90
    color_palette: 8BIT
    dimensions:
      width: 320
      height: 240
    update_interval: 1s
    lambda: |-
      it.fill(COLOR_OFF);
      it.rectangle(0, 0, it.get_width(), it.get_height(), COLOR_ON);
      // Крест для теста
      it.line(0, 0, it.get_width(), it.get_height(), COLOR_ON);
      it.line(it.get_width(), 0, 0, it.get_height(), COLOR_ON);
      // Квадрат в центре
      int cx = it.get_width() / 2;
      int cy = it.get_height() / 2;
      it.rectangle(cx - 30, cy - 30, cx + 30, cy + 30, COLOR_ON);

# --- UART для радара LD2410C ---
uart:
  id: radar_uart
  rx_pin: GPIO35
  tx_pin: GPIO22
  baud_rate: 256000

# --- Радар LD2410C ---
ld2410:
  id: radar

binary_sensor:
  - platform: ld2410
    has_target:
      name: "Presence"
    has_moving_target:
      name: "Moving Target"
    has_still_target:
      name: "Still Target"

sensor:
  - platform: ld2410
    moving_distance:
      name: "Moving Distance"
    still_distance:
      name: "Still Distance"
    detection_distance:
      name: "Detection Distance"

number:
  - platform: ld2410
    timeout:
      name: "Timeout"
    max_move_distance_gate:
      name: "Max Move Gate"
    max_still_distance_gate:
      name: "Max Still Gate"

# --- Серво MG995 ---
output:
  - platform: ledc
    pin: GPIO27
    id: servo_pwm
    frequency: 50Hz

servo:
  - id: clean_servo
    output: servo_pwm

# --- Кнопки управления ---
button:
  - platform: template
    name: "Clean Now"
    on_press:
      then:
        - servo.write:
            id: clean_servo
            level: 100%
        - delay: 2s
        - servo.write:
            id: clean_servo
            level: 0%

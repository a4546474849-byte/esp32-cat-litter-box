esphome:
  name: cat-litter-yamal

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:


font:
  - file: "gfonts://Montserrat"
    id: font_16
    size: 16
  - file: "gfonts://Montserrat"
    id: font_24
    size: 24
  - file: "gfonts://Montserrat"
    id: font_48
    size: 48

spi:
  id: vspi_display
  mosi_pin: GPIO13
  miso_pin: GPIO12
  clk_pin: GPIO14

display:
  - platform: ili9xxx
    id: tft_display
    model: ili9341
    spi_id: vspi_display
    dc_pin: GPIO2
    cs_pin: GPIO15
    reset_pin: GPIO21
    invert_colors: true
    dimensions:
      width: 240
      height: 320
    update_interval: never

lvgl:
  displays:
    - tft_display
  touchscreens:
    - my_touch
  rotation: 90
  buffer_size: 10%
  pages:
    - id: canvas_1
      bg_color: 0x111827
      widgets:
        - label:
            x: 60
            y: 20
            width: 200
            height: 50
            text: "SMART CAT"
            text_font: font_24
            text_color: 0xFFFFFF

        - label:
            id: lv_status
            x: 100
            y: 80
            width: 120
            height: 40
            text: "IDLE"
            text_font: font_48
            text_color: 0x50E2E0

        - button:
            id: lv_button_12
            x: 108
            y: 200
            width: 105
            height: 40
            bg_color: 0x3F1F03
            border_width: 2
            border_color: 0x0700E0
            radius: 15
            widgets:
              - label:
                  text: "CLEAN"
                  text_color: 0xF2F3F3

touchscreen:
  - platform: xpt2046
    id: my_touch
    cs_pin: GPIO33
    update_interval: 50ms
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860
